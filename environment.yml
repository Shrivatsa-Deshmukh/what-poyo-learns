# install: conda env create -f environment.yml
# Versions pinned to what was installed on 2026-10-02 (RTX 4050, driver 610.43, CUDA 13.3).
# torch comes from pip (cu130 wheel): the conda `pytorch` channel is deprecated.
# torch_brain 0.2.0 bundles the former `brainsets` (CLI) and `temporaldata` packages.
name: f_models
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.16
  - pip=26.2.1
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=3.0.6
  - scikit-learn=1.9.1
  - matplotlib=3.11.2
  - seaborn=0.13.2
  - statsmodels=0.15.0   # used directly (Holm correction, clustered OLS)
  - tqdm=4.70.1
  - h5py=3.16.0
  - pytest=9.1.1
  - ipykernel=7.4.0
  - jupyterlab=4.6.4
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1+cu130
      - torch_brain==0.2.0
      - torchmetrics==1.9.0
      - hydra-core==1.3.7
      - omegaconf==2.3.1
      - wandb==0.30.0
